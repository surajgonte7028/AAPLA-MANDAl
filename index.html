<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12001f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="आपला मंडळ"><link rel="manifest" href="manifest.webmanifest"><title>आपला मंडळ</title><style>*{box-sizing:border-box}body{margin:0;background:#07050b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 30% 10%,#8b2cff33,transparent 35%),radial-gradient(circle at 80% 80%,#5d00ff2b,transparent 35%);z-index:-1}.app{max-width:720px;margin:auto;padding:18px 14px 90px}.head{padding:20px;border:1px solid #a855f733;border-radius:24px;background:#ffffff0a;backdrop-filter:blur(18px);box-shadow:0 0 35px #7c3aed18}.brand{font-size:28px;font-weight:800}.sub{color:#c9bdd5;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card,.panel{background:#ffffff0b;border:1px solid #a855f733;border-radius:20px;padding:15px;backdrop-filter:blur(18px);box-shadow:inset 0 1px #fff1}.label{font-size:12px;color:#b9a9c5}.value{font-size:20px;font-weight:800;margin-top:6px}.income{color:#c084fc}.expense{color:#f0abfc}.balance{color:#e9d5ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:14px;font-weight:750;color:white;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 8px 25px #7c3aed2d}.btn.secondary{background:#ffffff0d;border:1px solid #a855f744}.panel{margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff10}.row:last-child{border-bottom:0}.muted{color:#a99daf;font-size:13px}.empty{text-align:center;color:#aaa;padding:25px}input,select{width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff1c;background:#0e0b13;color:white;margin:6px 0 10px}label{font-size:13px;color:#cfc2d8}.hidden{display:none}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:10px}.sheet{width:min(720px,100%);background:#100b16;border:1px solid #a855f755;border-radius:25px 25px 12px 12px;padding:18px;max-height:90vh;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center}.close{background:#ffffff12;border:1px solid #fff2;color:#fff;border-radius:10px;padding:8px 12px}.install{display:none;margin-top:12px}.small{font-size:12px}.danger{background:#7f1d1d}.proof{max-width:100%;border-radius:12px;margin-top:8px}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.brand{font-size:25px}}</style></head><body><main class="app"><header class="head"><div class="brand">आपला मंडळ</div><div class="sub">सिल्व्हर स्टार मित्र मंडळ</div><button id="install" class="btn install">📲 Add to Home Screen</button></header><section class="grid"><div class="card"><div class="label">Total Income</div><div id="income" class="value income">₹0</div></div><div class="card"><div class="label">Total Expense</div><div id="expense" class="value expense">₹0</div></div><div class="card"><div class="label">Balance</div><div id="balance" class="value balance">₹0</div></div></section><section class="actions"><button class="btn" onclick="openForm('Income')">＋ Add Income</button><button class="btn" onclick="openForm('Expense')">＋ Add Expense</button><button class="btn secondary" onclick="showTransactions()">📋 Transactions</button><button class="btn secondary" onclick="showReports()">📊 Reports</button></section><section class="panel"><div class="top"><h3>Recent Transactions</h3><span id="count" class="muted"></span></div><div id="recent"></div></section></main><div id="modal" class="modal hidden"><div class="sheet"><div class="top"><h3 id="modalTitle">Add</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><script>const KEY='aapla_mandal_transactions_v1';let tx=JSON.parse(localStorage.getItem(KEY)||'[]');let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').style.display='block'});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);function save(){localStorage.setItem(KEY,JSON.stringify(tx));render()}function render(){let inc=tx.filter(x=>x.type==='Income').reduce((a,x)=>a+x.amount,0),exp=tx.filter(x=>x.type==='Expense').reduce((a,x)=>a+x.amount,0);income.textContent=money(inc);expense.textContent=money(exp);balance.textContent=money(inc-exp);count.textContent=tx.length+' entries';recent.innerHTML=tx.slice().reverse().slice(0,5).map(x=>`<div class="row"><div><b>${x.person||x.desc}</b><div class="muted">${x.category} · ${x.date} · ${x.method}</div></div><b>${x.type==='Income'?'+':'−'}${money(x.amount)}</b></div>`).join('')||'<div class="empty">No transactions yet</div>'}function openForm(type){modalTitle.textContent='Add '+type;modalBody.innerHTML=`<label>${type==='Income'?'Person Name':'Description'}</label><input id="fName" placeholder="Enter name/description"><label>Amount</label><input id="fAmount" type="number" inputmode="decimal" placeholder="₹ Amount"><label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Category</label><select id="fCat">${(type==='Income'?['Vargani','Donation','Other Income']:['Decoration','Lighting','Transport','Prasad','Pooja Samagri','Haar & Flower']).map(x=>`<option>${x}</option>`).join('')}</select><label>Payment Method</label><select id="fMethod"><option>Cash</option><option>UPI</option><option>Bank</option></select><label>Proof / Bill Photo</label><input id="fFile" type="file" accept="image/*"><button class="btn" onclick="addTx('${type}')">Save Transaction</button>`;modal.classList.remove('hidden')}async function addTx(type){let amount=Number(fAmount.value);if(!fName.value.trim()||!amount){alert('Name/description आणि amount भरा');return}let proof='';if(fFile.files[0])proof=await fileData(fFile.files[0]);tx.push({id:Date.now(),type,person:type==='Income'?fName.value.trim():'',desc:type==='Expense'?fName.value.trim():'',amount,category:fCat.value,method:fMethod.value,date:fDate.value,proof});save();closeModal()}function fileData(f){return new Promise((r,j)=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=j;rd.readAsDataURL(f)})}function closeModal(){modal.classList.add('hidden')}function showTransactions(){modalTitle.textContent='All Transactions';modalBody.innerHTML=tx.slice().reverse().map(x=>`<div class="row"><div><b>${x.person||x.desc}</b><div class="muted">${x.type} · ${x.category} · ${x.date} · ${x.method}</div>${x.proof?`<img class="proof" src="${x.proof}">`:''}</div><div><b>${money(x.amount)}</b><br><button class="close" onclick="delTx(${x.id})">Delete</button></div></div>`).join('')||'<div class="empty">No transactions</div>';modal.classList.remove('hidden')}function delTx(id){if(confirm('Delete transaction?')){tx=tx.filter(x=>x.id!==id);save();showTransactions()}}function showReports(){let exp=tx.filter(x=>x.type==='Expense'),inc=tx.filter(x=>x.type==='Income'),cats={};exp.forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);modalTitle.textContent='Reports';modalBody.innerHTML=`<div class="card"><b>Income</b><div class="value">${money(inc.reduce((a,x)=>a+x.amount,0))}</div></div><br><div class="card"><b>Expense</b><div class="value">${money(exp.reduce((a,x)=>a+x.amount,0))}</div></div><br><h4>Category-wise Expense</h4>${Object.entries(cats).map(([k,v])=>`<div class="row"><span>${k}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">No expense data</div>'}<br><button class="btn secondary" onclick="exportCSV()">⬇ Export CSV</button>`;modal.classList.remove('hidden')}function exportCSV(){let rows=[['Type','Person/Description','Amount','Category','Method','Date'],...tx.map(x=>[x.type,x.person||x.desc,x.amount,x.category,x.method,x.date])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='aapla-mandal-transactions.csv';a.click()}render();</script></body></html>
