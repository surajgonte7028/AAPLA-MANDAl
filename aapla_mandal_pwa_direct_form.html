<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12001f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="आपला मंडळ">
<link rel="manifest" href="./manifest.webmanifest"><title>आपला मंडळ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07050b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 30% 10%,#8b2cff33,transparent 35%),radial-gradient(circle at 80% 80%,#5d00ff2b,transparent 35%);z-index:-1}.app{max-width:720px;margin:auto;padding:18px 14px 90px}.head{padding:20px;border:1px solid #a855f733;border-radius:24px;background:#ffffff0a;backdrop-filter:blur(18px);box-shadow:0 0 35px #7c3aed18}.brand{font-size:28px;font-weight:800}.sub{color:#c9bdd5;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card,.panel{background:#ffffff0b;border:1px solid #a855f733;border-radius:20px;padding:15px;backdrop-filter:blur(18px);box-shadow:inset 0 1px #fff1}.label{font-size:12px;color:#b9a9c5}.value{font-size:20px;font-weight:800;margin-top:6px}.income{color:#c084fc}.expense{color:#f0abfc}.balance{color:#e9d5ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:14px;font-weight:750;color:white;background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 8px 25px #7c3aed2d;cursor:pointer}.btn.secondary{background:#ffffff0d;border:1px solid #a855f744}.panel{margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff10}.row:last-child{border-bottom:0}.muted{color:#a99daf;font-size:13px}.empty{text-align:center;color:#aaa;padding:25px}input,select{width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff1c;background:#0e0b13;color:white;margin:6px 0 10px}label{font-size:13px;color:#cfc2d8;display:block}.hidden{display:none!important}.formbox{margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center}.close{background:#ffffff12;border:1px solid #fff2;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}.install{display:none;margin-top:12px}.proof{max-width:100%;border-radius:12px;margin-top:8px}.danger{background:#7f1d1d}.small{font-size:12px}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.brand{font-size:25px}}
</style></head>
<body><main class="app">
<header class="head"><div class="brand">आपला मंडळ</div><div class="sub">सिल्व्हर स्टार मित्र मंडळ</div><button id="installBtn" class="btn install">📲 Add to Home Screen</button></header>
<section class="grid"><div class="card"><div class="label">Total Income</div><div id="income" class="value income">₹0</div></div><div class="card"><div class="label">Total Expense</div><div id="expense" class="value expense">₹0</div></div><div class="card"><div class="label">Balance</div><div id="balance" class="value balance">₹0</div></div></section>
<section class="actions"><button id="addIncome" class="btn">＋ Add Income</button><button id="addExpense" class="btn">＋ Add Expense</button><button id="transactionsBtn" class="btn secondary">📋 Transactions</button><button id="reportsBtn" class="btn secondary">📊 Reports</button></section>
<section id="formPanel" class="panel formbox hidden"><div class="top"><h3 id="formTitle">Add Income</h3><button id="cancelBtn" class="close">✕</button></div>
<form id="txForm"><label id="nameLabel">Person Name</label><input id="fName" required placeholder="Enter name"><label>Amount</label><input id="fAmount" required type="number" min="1" step="0.01" inputmode="decimal" placeholder="₹ Amount"><label>Date</label><input id="fDate" required type="date"><label>Category</label><select id="fCat"></select><label>Payment Method</label><select id="fMethod"><option>Cash</option><option>UPI</option><option>Bank</option></select><label>Proof / Bill Photo</label><input id="fFile" type="file" accept="image/*"><button class="btn" type="submit">💾 Save Transaction</button></form></section>
<section class="panel"><div class="top"><h3>Recent Transactions</h3><span id="count" class="muted"></span></div><div id="recent"></div></section>
<section id="viewPanel" class="panel hidden"><div class="top"><h3 id="viewTitle">Transactions</h3><button id="viewClose" class="close">✕</button></div><div id="viewBody"></div></section>
</main>
<script>
(function(){
'use strict';
const KEY='aapla_mandal_transactions_v2';
let tx=[]; try{tx=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(tx))tx=[];}catch(e){tx=[];}
const $=id=>document.getElementById(id);
const incomeEl=$('income'),expenseEl=$('expense'),balanceEl=$('balance'),countEl=$('count'),recentEl=$('recent');
const formPanel=$('formPanel'),formTitle=$('formTitle'),txForm=$('txForm'),nameLabel=$('nameLabel'),fName=$('fName'),fAmount=$('fAmount'),fDate=$('fDate'),fCat=$('fCat'),fMethod=$('fMethod'),fFile=$('fFile');
const viewPanel=$('viewPanel'),viewTitle=$('viewTitle'),viewBody=$('viewBody');
let currentType='Income';
const incomeCats=['Vargani','Donation','Other Income'];
const expenseCats=['Decoration','Lighting','Transport','Prasad','Pooja Samagri','Haar & Flower'];
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0)}
function render(){let inc=0,exp=0;tx.forEach(x=>x.type==='Income'?inc+=Number(x.amount):exp+=Number(x.amount));incomeEl.textContent=money(inc);expenseEl.textContent=money(exp);balanceEl.textContent=money(inc-exp);countEl.textContent=tx.length+' entries';recentEl.innerHTML=tx.slice().reverse().slice(0,5).map(x=>'<div class="row"><div><b>'+esc(x.person||x.desc)+'</b><div class="muted">'+esc(x.category)+' · '+esc(x.date)+' · '+esc(x.method)+'</div></div><b>'+(x.type==='Income'?'+':'−')+money(x.amount)+'</b></div>').join('')||'<div class="empty">No transactions yet</div>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openForm(type){currentType=type;formTitle.textContent='Add '+type;nameLabel.textContent=type==='Income'?'Person Name':'Description';fName.placeholder=type==='Income'?'Enter person name':'Enter expense description';fCat.innerHTML=(type==='Income'?incomeCats:expenseCats).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');fDate.value=new Date().toISOString().slice(0,10);txForm.reset();fDate.value=new Date().toISOString().slice(0,10);fMethod.value='Cash';formPanel.classList.remove('hidden');viewPanel.classList.add('hidden');formPanel.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>fName.focus(),100)}
function closeForm(){formPanel.classList.add('hidden')}
function fileData(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
txForm.addEventListener('submit',async function(e){e.preventDefault();const amount=Number(fAmount.value);if(!fName.value.trim()||!amount||amount<0){alert('Name/description आणि amount भरा');return}const proof=await fileData(fFile.files&&fFile.files[0]);tx.push({id:Date.now(),type:currentType,person:currentType==='Income'?fName.value.trim():'',desc:currentType==='Expense'?fName.value.trim():'',amount,category:fCat.value,method:fMethod.value,date:fDate.value,proof});try{localStorage.setItem(KEY,JSON.stringify(tx));}catch(err){alert('Photo खूप मोठा आहे. Photo शिवाय पुन्हा save करा.');return}closeForm();render();alert('Transaction saved successfully!')});
function showTransactions(){closeForm();viewTitle.textContent='All Transactions';viewBody.innerHTML=tx.slice().reverse().map(x=>'<div class="row"><div><b>'+esc(x.person||x.desc)+'</b><div class="muted">'+esc(x.type)+' · '+esc(x.category)+' · '+esc(x.date)+' · '+esc(x.method)+'</div>'+(x.proof?'<img class="proof" src="'+x.proof+'">':'')+'</div><div><b>'+money(x.amount)+'</b><br><button class="close danger" data-del="'+x.id+'">Delete</button></div></div>').join('')||'<div class="empty">No transactions</div>';viewPanel.classList.remove('hidden');viewPanel.scrollIntoView({behavior:'smooth',block:'start'})}
function showReports(){closeForm();let exp=tx.filter(x=>x.type==='Expense'),inc=tx.filter(x=>x.type==='Income'),cats={};exp.forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));viewTitle.textContent='Reports';viewBody.innerHTML='<div class="card"><b>Income</b><div class="value">'+money(inc.reduce((a,x)=>a+Number(x.amount),0))+'</div></div><br><div class="card"><b>Expense</b><div class="value">'+money(exp.reduce((a,x)=>a+Number(x.amount),0))+'</div></div><br><h4>Category-wise Expense</h4>'+(Object.entries(cats).map(([k,v])=>'<div class="row"><span>'+esc(k)+'</span><b>'+money(v)+'</b></div>').join('')||'<div class="empty">No expense data</div>')+'<br><button id="csvBtn" class="btn secondary">⬇ Export CSV</button>';viewPanel.classList.remove('hidden');viewPanel.scrollIntoView({behavior:'smooth',block:'start'});$('csvBtn').addEventListener('click',exportCSV)}
function exportCSV(){const rows=[['Type','Person/Description','Amount','Category','Method','Date'],...tx.map(x=>[x.type,x.person||x.desc,x.amount,x.category,x.method,x.date])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('
');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='aapla-mandal-transactions.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
viewBody.addEventListener('click',function(e){const b=e.target.closest('[data-del]');if(!b)return;const id=Number(b.getAttribute('data-del'));if(confirm('Delete transaction?')){tx=tx.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(tx));render();showTransactions()}});
$('addIncome').addEventListener('click',()=>openForm('Income'));$('addExpense').addEventListener('click',()=>openForm('Expense'));$('transactionsBtn').addEventListener('click',showTransactions);$('reportsBtn').addEventListener('click',showReports);$('cancelBtn').addEventListener('click',closeForm);$('viewClose').addEventListener('click',()=>viewPanel.classList.add('hidden'));
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBtn').style.display='block'});$('installBtn').addEventListener('click',async()=>{if(deferred){deferred.prompt();deferred=null}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
})();
</script></body></html>
